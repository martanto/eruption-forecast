<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let mode;
        try { mode = localStorage.getItem("atlas-theme"); } catch {}
        document.documentElement.dataset.mode = mode === "light" || mode === "dark"
          ? mode : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <meta name="theme-color" content="#f6f5ef" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
    <meta
      name="description"
      content="Explore the eruption forecasting pipeline, its source code, scenarios, and implementation gaps."
    />
    <title>Pipeline Atlas · Eruption Forecast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
